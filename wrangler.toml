name = "uuidify"
account_id = "6740062b250900222185a7f9305d6e86"
main = "workers/main.js"
compatibility_date = "2025-11-12"
workers_dev = false
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.uuidify.io/*", zone_name = "uuidify.io" }
]

[vars]
GO_API_URL = "https://api.uuidify.io"
BUILD_VERSION = "dev"
GIT_COMMIT = "local"

[[r2_buckets]]
binding = "LOG_BUCKET"
bucket_name = "uuidify-logs-wnam"

[[analytics_engine_datasets]]
binding = "UUIDIFY_ANALYTICS"
dataset = "uuidify_logs"
