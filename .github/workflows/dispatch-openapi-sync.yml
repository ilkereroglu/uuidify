name: Dispatch OpenAPI Sync

on:
  push:
    paths:
      - 'api/openapi.yaml'

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Send repository_dispatch event to uuidify-go
        run: |
          cat <<'EOF' > payload.json
          {
            "event_type": "openapi_updated",
            "client_payload": {
              "source_repo": "${GITHUB_REPOSITORY}",
              "file": "api/openapi.yaml",
              "commit": "${GITHUB_SHA}",
              "ref": "${GITHUB_REF}",
              "url": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/api/openapi.yaml"
            }
          }
          EOF

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.UUIDIFY_GO_SYNC_TOKEN }}" \
            https://api.github.com/repos/ilkereroglu/uuidify-go/dispatches \
            -d @payload.json
