name: 🧩 UUIDify CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-test:
    name: 🧪 Build, Test & Worker Check
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ github.ref_name }}
      GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build -v ./cmd/server

      - name: Run tests
        run: go test ./... -v

      - name: Install Wrangler CLI
        run: npm install -g wrangler@4.47.0

      - name: Worker dry-run deploy check
        run: wrangler deploy --dry-run

  docker-build-push:
    name: 🐳 Build & Push Docker image
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

  post-deploy-health-check:
    name: ✅ Post-Deploy Health Checks
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: ${{ always() && needs.docker-build-push.result == 'success' }}
    steps:
      - name: Verify /health endpoints
        run: |
          curl -fsS https://api.uuidify.io/health
          curl -fsS "https://api.uuidify.io/health?format=json"
