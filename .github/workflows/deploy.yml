name: Deploy UUIDify Platform

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Cache Go build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - name: Go test
        run: go test ./... -v

  build:
    name: Build all projects
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        dir: [dashboard, docs, status]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ matrix.dir }}-${{ hashFiles(format('{0}/package-lock.json', matrix.dir)) }}
          restore-keys: ${{ runner.os }}-npm-${{ matrix.dir }}-
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Build ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        run: npm run build

  deploy:
    name: Deploy to Cloudflare Workers & Pages
    needs: [test, build]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6740062b250900222185a7f9305d6e86
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Build docs
        working-directory: docs
        run: |
          npm ci
          npm run build
      - name: Build status site
        working-directory: status
        run: |
          npm ci
          npm run build
      - name: Deploy Worker API
        run: wrangler deploy
      - name: Deploy dashboard
        run: wrangler pages deploy ./dashboard/out --project-name uuidify-dashboard --branch ${{ github.ref_name }}
      - name: Deploy docs
        run: wrangler pages deploy ./docs/out --project-name uuidify-docs --branch ${{ github.ref_name }}
      - name: Deploy status
        run: wrangler pages deploy ./status/out --project-name uuidify-status --branch ${{ github.ref_name }}
      - name: Verify deployments
        run: |
          wrangler pages deployment list --project-name uuidify-dashboard
          wrangler pages deployment list --project-name uuidify-docs
          wrangler pages deployment list --project-name uuidify-status
